<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Game Results Predictor</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #8892a4;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; min-height: 100vh; overflow-x: hidden; width: 100%; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; max-width: 100%; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; padding: 12px; width: 100%; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; max-width: 100%; overflow-x: hidden; }
  .card h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .big { font-size: 30px; font-weight: 700; line-height: 1; }
  .label { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .key { color: var(--muted); }
  .row .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .signal-bar-wrap { margin-top: 4px; }
  .signal-row { display: grid; grid-template-columns: 72px 1fr 72px; align-items: center; gap: 6px; margin-bottom: 5px; }
  .signal-name { font-size: 11px; color: var(--muted); }
  .bar-bg { background: var(--border); border-radius: 3px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
  .bar-odd  { background: var(--green); }
  .bar-even { background: var(--red); }
  .bar-neu  { background: var(--muted); }
  .signal-pct { font-size: 11px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  /* Disc dots */
  .discs { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
  .disc { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .disc.R { background: var(--red);   color: #fff; }
  .disc.W { background: #334155;      color: var(--muted); }
  .disc.sm { width: 18px; height: 18px; font-size: 9px; }
  .disc.xs { width: 13px; height: 13px; font-size: 8px; }
  .disc-label { font-size: 9px; color: var(--muted); text-align: center; margin-top: 2px; }
  .disc-wrap { display: flex; flex-direction: column; align-items: center; }
  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  thead th { color: var(--muted); font-weight: 500; text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody td { padding: 5px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: middle; overflow: hidden; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  .win   { color: var(--green); font-weight: 600; }
  .loss  { color: var(--red);   font-weight: 600; }
  .muted { color: var(--muted); font-size: 11px; }
  .odd   { color: #a78bfa; }
  .even  { color: #60a5fa; }
  /* Action card */
  .action-card { grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .action-big { font-size: 36px; font-weight: 800; min-width: 80px; }
  .action-big.USE   { color: var(--green); }
  .action-big.SKIP  { color: var(--yellow); }
  .action-big.AVOID { color: var(--red); }
  .conf-detail { line-height: 1.6; }
  /* Misc */
  .spinner { display: none; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  button:hover { opacity: .85; }
  .error-msg { color: var(--red); padding: 20px; }
  .streak-badge { background: rgba(239,68,68,.15); color: var(--red); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .mode-badge { background: rgba(99,102,241,.15); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 11px; margin-left: 8px; }
  .divider { width: 1px; background: var(--border); align-self: stretch; }
  .phase-action { font-size: 15px; font-weight: 700; }
  .phase-action.USE_STRONG { color: var(--green); }
  .phase-action.USE        { color: #86efac; }
  .phase-action.SKIP       { color: var(--yellow); }
  .phase-action.AVOID      { color: var(--red); }
  .phase-action.INSUFFICIENT_DATA { color: var(--muted); }
  /* Bet signal */
  .bet-banner { grid-column: 1 / -1; border-radius: 8px; padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; max-width: 100%; overflow-x: hidden; }
  .bet-banner > div { min-width: 0; flex-shrink: 1; }
  .bet-banner.yes { background: rgba(34,197,94,.12); border: 2px solid var(--green); }
  .bet-banner.no  { background: rgba(100,116,139,.08); border: 2px solid #334155; }
  .bet-label { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
  .bet-label.yes { color: var(--green); }
  .bet-label.no  { color: #475569; }
  /* Tabs */
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--border); background: var(--card); }
  .tab { padding: 6px 16px; border-radius: 6px 6px 0 0; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; border-bottom: none; color: var(--muted); background: transparent; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .tab:hover:not(.active) { color: var(--text); }
  /* History toolbar */
  .data-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 0 10px; flex-wrap: wrap; }
  .data-toolbar input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 12px; font-size: 12px; width: 220px; outline: none; }
  .data-toolbar input:focus { border-color: var(--accent); }
  .data-toolbar select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
  .data-toolbar .info { color: var(--muted); font-size: 11px; margin-left: auto; }
  .pagination { display: flex; align-items: center; gap: 6px; padding: 12px 20px; flex-wrap: wrap; }
  .pagination button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 5px 12px; font-size: 12px; border-radius: 5px; cursor: pointer; }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: .35; cursor: default; }
  .pagination button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pagination .pg-info { color: var(--muted); font-size: 12px; margin: 0 8px; }
  .bet-direction { font-size: 24px; font-weight: 800; }
  .bet-conf { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .bet-round { font-size: 11px; color: var(--muted); }
  .bet-tag { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; text-transform: uppercase; letter-spacing: .06em; }
  .bet-tag.yes { background: rgba(34,197,94,.2); color: var(--green); }
  .bet-tag.no  { background: rgba(100,116,139,.2); color: #64748b; }
  .toggle-wrap { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .toggle { position:relative; display:inline-block; width:34px; height:18px; }
  .toggle input { opacity:0; width:0; height:0; }
  .toggle-slider { position:absolute; inset:0; background:#334155; border-radius:18px; cursor:pointer; transition:.2s; }
  .toggle-slider:before { content:''; position:absolute; width:12px; height:12px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
  .toggle input:checked + .toggle-slider { background:var(--green); }
  .toggle input:checked + .toggle-slider:before { transform:translateX(16px); }
</style>
</head>
<body>

<header>
  <h1>Live Game Results Predictor</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="spinner" id="spinner"></div>
    <div class="toggle-wrap">
      <label class="toggle"><input type="checkbox" id="trainToggle" onchange="setTraining(this.checked)"><span class="toggle-slider"></span></label>
      <span id="trainLabel">Training: —</span>
    </div>
    <button onclick="refresh()">&#8635; Refresh</button>
    <a href="/logout" style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:5px;padding:5px 12px;font-size:12px;text-decoration:none;font-weight:500;">Sign out</a>
    <div class="meta" id="meta">Loading…</div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-pred" onclick="switchTab('pred')">3MDiscs</div>
  <div class="tab" id="tab-new"  onclick="switchTab('new')">3MDiscs-Hot</div>
  <div class="tab" id="tab-cg"   onclick="switchTab('cg')">3MRedGreen</div>
</div>

<div id="root"><p class="error-msg">Loading prediction data…</p></div>
<div id="new-panel" style="display:none"></div>
<div id="cg-panel"  style="display:none"></div>

<script>
async function load() {
  const [predRes, statsRes, cfgRes] = await Promise.all([
    fetch('/api/prediction'),
    fetch('/api/stats'),
    fetch('/api/config'),
  ]);
  if (!predRes.ok) {
    const err = await predRes.json().catch(() => ({}));
    document.getElementById('root').innerHTML = `<p class="error-msg">${err.error || 'No data yet.'}</p>`;
    return;
  }
  const p     = await predRes.json();
  const stats = statsRes.ok ? await statsRes.json().catch(() => ({})) : {};
  const cfg   = cfgRes.ok  ? await cfgRes.json().catch(() => ({}))   : {};
  _pred.page  = 1;
  render(p, stats, cfg);
  document.getElementById('meta').innerHTML =
    `Last update: ${p.timestamp}<br>Round ${p.last_id} — ${p.total_rows} rows`;
}

function refresh() {
  document.getElementById('spinner').style.display = 'block';
  fetch('/api/refresh', {method:'POST'})
    .then(() => setTimeout(() => { load(); document.getElementById('spinner').style.display='none'; }, 3500));
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    const enabled = cfg.training_enabled !== false;
    document.getElementById('trainToggle').checked = enabled;
    document.getElementById('trainLabel').textContent = 'Training: ' + (enabled ? 'ON' : 'OFF');
    document.getElementById('trainLabel').style.color = enabled ? 'var(--green)' : 'var(--red)';
  } catch(e) {}
}

async function updateBankroll(val) {
  const br = parseFloat(val);
  if (isNaN(br) || br <= 0) return;
  await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({bankroll: br})
  });
  load();
}

async function setTraining(enabled) {
  document.getElementById('trainLabel').textContent = 'Training: ' + (enabled ? 'ON' : 'OFF');
  document.getElementById('trainLabel').style.color = enabled ? 'var(--green)' : 'var(--red)';
  await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({training_enabled: enabled})
  });
}

function pct(v)  { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
function fmt(v)  { return v != null ? (v * 100).toFixed(1) : '—'; }

// Render 4 disc dots from a 4-char string like "RWRW" or array ['R','W','R','W']
function discDots(pattern, size = '') {
  if (!pattern) return '—';
  const arr = Array.isArray(pattern) ? pattern : pattern.split('');
  return `<div class="discs">` +
    arr.map((d, i) =>
      `<div class="disc-wrap">
        <div class="disc ${d} ${size}">${d}</div>
        <div class="disc-label">D${i+1}</div>
      </div>`
    ).join('') +
  `</div>`;
}

// Mini discs for table rows (no labels) — xs size, tight gap
function miniDiscs(pattern) {
  if (!pattern) return '<span class="muted">—</span>';
  const arr = Array.isArray(pattern) ? pattern : pattern.split('');
  return `<div class="discs" style="gap:3px">` +
    arr.map(d => `<div class="disc ${d} xs">${d}</div>`).join('') +
  `</div>`;
}

function signalBar(name, value, weight, inverted) {
  if (value == null) return '';
  const pctVal = value * 100;
  const isOdd  = value > 0.5;
  const fillPct = Math.abs(pctVal - 50) * 2;
  const cls = Math.abs(pctVal - 50) < 3 ? 'bar-neu' : (isOdd ? 'bar-odd' : 'bar-even');
  const label = isOdd ? `ODD ${pct(value)}` : `EVEN ${pct(1 - value)}`;
  const wStr = weight != null ? ` <span style="color:var(--muted);font-size:10px">(w=${weight.toFixed(2)})</span>` : '';
  const invTag = inverted ? ` <span style="color:var(--yellow);font-size:9px">⚠inv</span>` : '';
  return `
  <div class="signal-row">
    <span class="signal-name">${name}${wStr}${invTag}</span>
    <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${fillPct}%"></div></div>
    <span class="signal-pct ${isOdd?'odd':'even'}">${label}</span>
  </div>`;
}

function reasonsCard(p) {
  const s = p.signals || {};
  const inv = p.inverted_signals || [];
  const sup = p.suppressed_signals || [];
  const dirLbl = p.prediction.odd_pct > 0.5 ? 'ODD' : 'EVEN';

  const allSigs = [
    { name:'disc_seq', value:s.disc_seq?.value,  weight:s.disc_seq?.weight, extra: s.disc_seq?.len > 0 ? `matched last ${s.disc_seq.len} disc patterns — ${s.disc_seq.n} occurrences` : null },
    { name:'persist',  value:s.persist?.value,   weight:s.persist?.weight   },
    { name:'period',   value:s.period?.value,    weight:s.period?.weight,   extra: s.period?.lag > 0 ? `autocorrelation at lag=${s.period.lag}` : null },
    { name:'breakout', value:s.breakout?.value,  weight:s.breakout?.weight  },
    { name:'lstm',     value:s.lstm?.value,      weight:null                },
  ].filter(x => x.value != null);

  const sorted = [...allSigs].sort((a,b) => (b.weight||0) - (a.weight||0));

  const rows = sorted.map(sig => {
    const isInv = inv.includes(sig.name);
    const isSup = sup.includes(sig.name);
    const dir = sig.value > 0.5 ? 'ODD' : 'EVEN';
    const strength = Math.abs(sig.value - 0.5) * 200;
    const dirColor = dir === 'ODD' ? 'var(--green)' : '#60a5fa';
    const wPct = sig.weight != null ? `${(sig.weight*100).toFixed(1)}% weight` : 'no weight';
    const badges = [
      isInv ? `<span style="color:var(--yellow);font-size:9px;font-weight:700;background:rgba(234,179,8,.15);border-radius:3px;padding:1px 4px">⚠ INVERTED</span>` : '',
      isSup ? `<span style="color:var(--muted);font-size:9px;background:rgba(100,116,139,.15);border-radius:3px;padding:1px 4px">SUPPRESSED</span>` : '',
    ].filter(Boolean).join(' ');
    return `
    <div style="display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${sig.name} ${badges}</div>
        <div style="font-size:10px;color:var(--muted)">${wPct}</div>
      </div>
      <div>
        <div class="bar-bg"><div class="bar-fill ${dir==='ODD'?'bar-odd':'bar-even'}" style="width:${strength.toFixed(0)}%"></div></div>
        ${sig.extra ? `<div style="font-size:10px;color:var(--muted);margin-top:3px">${sig.extra}</div>` : ''}
      </div>
      <div style="text-align:right;font-size:12px;font-weight:700;color:${dirColor}">${dir}<br><span style="font-size:10px;color:var(--muted)">${pct(dir==='ODD'?sig.value:1-sig.value)}</span></div>
    </div>`;
  }).join('');

  const invNote = inv.length ? `
    <div style="background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.2);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:11px;line-height:1.6">
      ⚠️ <strong style="color:var(--yellow)">${inv.join(', ')}</strong> ${inv.length===1?'was':'were'} inverted —
      ${inv.length===1?'this signal was':'these signals were'} wrong >50% of the time recently, so the direction was flipped before combining.
    </div>` : '';

  const streakNote = p.streak >= 3 ? `
    <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:8px 12px;margin-top:8px;font-size:11px">
      🔴 <strong>${p.streak} consecutive losses</strong> — signals adjusted via streak correction.
    </div>` : '';

  return `
  <div class="card">
    <h2>Why ${dirLbl}? <span style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">agree=${pct(p.agreement)} · amp=${p.amplifier}×</span></h2>
    ${rows}
    ${invNote}
    ${streakNote}
  </div>`;
}


function phaseCard(pa) {
  if (!pa) return '';
  const c = pa.components || {};
  const k = pa.kelly;
  const wrStr  = pa.win_rate != null
    ? `<strong style="color:var(--green)">${pct(pa.win_rate)}</strong> over ${pa.n_rounds} rounds`
    : `<span style="color:var(--muted)">only ${pa.n_rounds} rounds — building history</span>`;
  const kellyStr = k ? `
    <div class="row"><span class="key">Bet size (half-Kelly)</span><span class="val">${k.bet_pct}% of bankroll</span></div>
    <div class="row"><span class="key">P(ruin)</span><span class="val">${pct(k.p_ruin)}</span></div>
    <div class="row"><span class="key">Break-even period</span><span class="val">${k.breakeven} rounds</span></div>
    <div class="row"><span class="key">E[return] per round</span><span class="val">${k.e_per_round_pct}% of bankroll</span></div>
  ` : '';
  return `
  <div class="card">
    <h2>Phase Analysis</h2>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap">
      <div>
        <div class="phase-action ${pa.action}">${pa.action.replace('_', ' ')}</div>
        <div class="label" style="margin-top:4px">phase recommendation</div>
      </div>
      <div style="font-size:12px;background:rgba(255,255,255,.04);border-radius:6px;padding:6px 10px;font-family:monospace">
        ${pa.label}
      </div>
    </div>
    <div class="row"><span class="key">Phase win rate</span><span class="val">${wrStr}</span></div>
    <div class="row"><span class="key">Run type / value</span><span class="val">${c.run_type} ${c.run_val} (len=${c.run_len})</span></div>
    <div class="row"><span class="key">Balance (last 20)</span><span class="val">${c.balance} — ODD ${pct(c.odd_frac)}</span></div>
    <div class="row"><span class="key">Volatility (last 10)</span><span class="val">${c.volatility} — ${c.switches} switches</span></div>
    ${kellyStr}
  </div>`;
}

function render(p, stats = {}, cfg = {}) {
  const s    = p.signals;
  const pred = p.prediction;
  const conf = p.confidence;
  const actionCls = conf.action;

  const modeTag = p.mode === 'streak'
    ? `<span class="streak-badge">STREAK-${p.streak}</span>`
    : (p.mode === 'adaptive' ? `<span class="mode-badge">adaptive</span>` : '');

  const BET_THRESH = conf.threshold || 0.70;
  const isBet = conf.bet === true;
  const directionPct = pred.odd_pct > 0.5 ? pred.odd_pct : pred.even_pct;
  const directionLbl = pred.odd_pct > 0.5 ? 'ODD' : 'EVEN';

  // Kelly bet sizing
  const bankroll     = cfg.bankroll      || 5.0;
  const kellyBase    = cfg.kelly_fraction || 0.03;
  const confVal      = conf.value || 0;
  const kellyMult    = confVal >= 0.65 ? 1.5 : confVal >= 0.56 ? 1.0 : 0.5;
  const betSize      = +(bankroll * kellyBase * kellyMult).toFixed(2);
  const betSizeStr   = betSize.toFixed(2);


  document.getElementById('root').innerHTML = `
  <div class="grid">

    <!-- BET BANNER -->
    <div class="bet-banner ${isBet ? 'yes' : 'no'}">
      <div>
        <div class="bet-label ${isBet ? 'yes' : 'no'}">${isBet ? 'BET' : 'NO BET'}</div>
        <div class="bet-conf" style="margin-top:3px">
          ${conf.band_n >= 20
            ? (isBet
                ? `Win rate <strong style="color:var(--green)">${pct(conf.band_wr)}</strong> (n=${conf.band_n}) · model conf ${pct(conf.value)}`
                : `Win rate <strong style="color:#64748b">${pct(conf.band_wr)}</strong> (n=${conf.band_n}) · model conf ${pct(conf.value)} — skip this round`)
            : (isBet
                ? `Model conf <strong style="color:var(--green)">${pct(conf.value)}</strong> ≥ ${(BET_THRESH*100).toFixed(0)}% · only ${conf.band_n} rounds in band`
                : `Model conf <strong style="color:#64748b">${pct(conf.value)}</strong> below ${(BET_THRESH*100).toFixed(0)}% — skip this round`)}
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="bet-direction ${isBet ? (directionLbl === 'ODD' ? 'odd' : 'even') : ''}"
             style="${isBet ? '' : 'color:#475569'}">
          ${directionLbl} ${pct(directionPct)}
        </div>
        <div class="bet-round" style="margin-top:6px">Round ${p.next_round}${modeTag}</div>

// Poll /api/status every 10 s.
// Old model: refresh when snapshot mtime changes (new prediction written).
// New model: refresh only when last_id_new changes (new round actually arrived, ~3 min cycle).
let _lastMtime = 0, _lastIdNew = 0, _lastMtimeCg = 0;
async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) return;
    const data = await res.json();
    const mtime    = data.mtime       ?? 0;
    const idNew    = data.last_id_new ?? 0;
    const mtimeCg  = data.mtime_cg    ?? 0;

    if (mtime !== _lastMtime) {
      _lastMtime = mtime;
      load();
    }
    if (idNew !== 0 && idNew !== _lastIdNew) {
      _lastIdNew = idNew;
      if (document.getElementById('new-panel').style.display !== 'none') { _newDb.page = 1; loadNewModel(); }
    }
    if (mtimeCg !== 0 && mtimeCg !== _lastMtimeCg) {
      _lastMtimeCg = mtimeCg;
      if (document.getElementById('cg-panel').style.display !== 'none') { _cg.page = 1; loadColorGame(); }
    }
  } catch(e) {}
}

load();
loadConfig();
setInterval(pollStatus, 10000);

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('tab-pred').classList.toggle('active', tab === 'pred');
  document.getElementById('tab-new').classList.toggle('active',  tab === 'new');
  document.getElementById('tab-cg').classList.toggle('active',   tab === 'cg');
  document.getElementById('root').style.display      = tab === 'pred' ? '' : 'none';
  document.getElementById('new-panel').style.display = tab === 'new'  ? '' : 'none';
  document.getElementById('cg-panel').style.display  = tab === 'cg'   ? '' : 'none';
  if (tab === 'new') loadNewModel();
  if (tab === 'cg')  loadColorGame();
}

// ── New model pagination state ─────────────────────────────────────────────────
let _newDb = { page: 1, size: 50, search: '' };
let _newSearchTimer = null;
let _newFirstPredId = null;

function goNewPage(p)       { _newDb.page = p; loadNewModelData(); }
function onNewSizeChange(v) { _newDb.size = parseInt(v); _newDb.page = 1; loadNewModelData(); }
function onNewSearch(v) {
  clearTimeout(_newSearchTimer);
  _newSearchTimer = setTimeout(() => { _newDb.search = v; _newDb.page = 1; loadNewModelData(); }, 300);
}

async function loadNewModelData() {
  const { page, size, search } = _newDb;
  const res = await fetch(`/api/new/data?page=${page}&size=${size}&search=${encodeURIComponent(search)}`);
  if (!res.ok) return;
  renderNewModelData(await res.json());
}

function renderNewModelData(paged) {
  const body  = document.getElementById('new-hist-body');
  const info  = document.getElementById('new-hist-info');
  const pager = document.getElementById('new-hist-pager');
  if (!body) return;

  const { total, page, pages, rows } = paged;
  const start = (page - 1) * _newDb.size + 1;
  const end   = Math.min(page * _newDb.size, total);

  // Build rolling WR (trailing 20) from ascending rows
  const _ascRows = [...rows].sort((a,b) => parseInt(a.round_id) - parseInt(b.round_id));
  const _wrWin = [], _wrMap = {};
  for (const r of _ascRows) {
    if (r.result === 'WIN' || r.result === 'LOSS') {
      _wrWin.push(r.result === 'WIN' ? 1 : 0);
      if (_wrWin.length > 20) _wrWin.shift();
      if (_wrWin.length >= 5)
        _wrMap[r.round_id] = _wrWin.reduce((a,b)=>a+b,0) / _wrWin.length;
    }
  }

  const sortedRows = [...rows].sort((a,b) => parseInt(b.round_id) - parseInt(a.round_id));
  body.innerHTML = sortedRows.map(r => {
    const actualStr = r.actual || '';
    const actualOe  = r.oe || (actualStr ? (actualStr.split('').filter(c=>c==='R').length%2?'ODD':'EVEN') : '—');
    const predOe    = r.pred_oe || '—';
    const conf      = r.confidence ?? 0;
    const result    = (r.result && r.result !== 'Not Predicted') ? r.result : '—';
    const resCls    = result==='WIN'?'win':result==='LOSS'?'loss':'muted';
    const oeColor   = result==='WIN'?'var(--green)':result==='LOSS'?'var(--red)':null;
    const predClr   = oeColor||(predOe==='ODD'?'var(--yellow)':'var(--accent)');
    const actClr    = oeColor||(actualOe==='ODD'?'var(--yellow)':'var(--accent)');
    const confStr   = conf ? `<span style="color:#3b82f6;font-size:11px"> (${pct(conf)})</span>` : '';
    const isFlag    = actualStr==='WWWW'||actualStr==='RRRR';
    const isStart   = _newFirstPredId!==null && parseInt(r.round_id)===_newFirstPredId;
    const rowStyle  = isStart ? 'background:rgba(99,102,241,.18);border-left:3px solid var(--accent);'
                    : isFlag  ? 'background:rgba(249,115,22,.15);border-left:3px solid #f97316;' : '';
    const idBadge   = isStart ? `<span style="background:var(--accent);color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:1px 5px;margin-left:5px">START</span>`
                    : isFlag  ? `<span style="color:#f97316;font-weight:700;font-size:10px;margin-left:4px">${actualStr}</span>` : '';
    const rowWr     = _wrMap[r.round_id] ?? null;
    const wrStr     = rowWr!=null ? (rowWr*100).toFixed(0)+'%' : '—';
    const wrClr     = rowWr==null?'var(--muted)':rowWr>=0.65?'#22c55e':rowWr>=0.50?'var(--yellow)':'var(--red)';
    const betLabel  = conf>=0.65?'BET':conf>=0.60?'SKIP':conf>0?'AVOID':'—';
    const betClr    = conf>=0.65?'#22c55e':conf>=0.60?'var(--yellow)':'#ef4444';
    return `<tr style="${rowStyle}">
      <td style="font-size:11px;${oeColor?`color:${oeColor};font-weight:600`:''}">${r.round_id}${idBadge}</td>
      <td style="font-size:11px;color:${wrClr};font-weight:600">${wrStr}</td>
      <td><span style="font-size:10px;font-weight:700;color:${betClr}">${betLabel}</span></td>
      <td>${miniDiscs(actualStr)}</td>
      <td><span style="font-weight:600;color:${predClr}">${predOe}</span>${confStr}</td>
      <td><span style="font-weight:600;color:${actClr}">${actualOe}</span></td>
      <td class="${resCls}">${result}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="color:var(--muted);padding:12px">No records found</td></tr>';

  if (info) info.textContent = `${total} total · showing ${start}–${end}`;
  if (pager) {
    const lo = Math.max(1, page-3), hi = Math.min(pages, page+3);
    let btns = '';
    if (lo>1) btns += `<button onclick="goNewPage(1)">1</button>${lo>2?'<span class="pg-info">…</span>':''}`;
    for (let pg=lo; pg<=hi; pg++) btns += `<button class="${pg===page?'active':''}" onclick="goNewPage(${pg})">${pg}</button>`;
    if (hi<pages) btns += `${hi<pages-1?'<span class="pg-info">…</span>':''}<button onclick="goNewPage(${pages})">${pages}</button>`;
    pager.innerHTML = `<button onclick="goNewPage(${page-1})" ${page<=1?'disabled':''}>&#8592; Prev</button>
      ${btns}
      <button onclick="goNewPage(${page+1})" ${page>=pages?'disabled':''}>Next &#8594;</button>
      <span class="pg-info">Page ${page} of ${pages}</span>`;
  }
}

// ── Prediction tab history (paginated) ────────────────────────────────────────
let _pred = { page: 1, size: 50, search: '', sort: 'id', dir: 'desc' };
let _predSearchTimer = null;

async function loadPredData() {
  const { page, size, search, sort, dir } = _pred;
  const url = `/api/data?page=${page}&size=${size}&search=${encodeURIComponent(search)}&sort=${sort}&dir=${dir}`;
  const res = await fetch(url);
  if (!res.ok) return;
  renderPredData(await res.json());
}

function sortPred(col) {
  if (col === 'id') { _pred.sort = 'id'; _pred.dir = 'desc'; }
  else if (_pred.sort === col) _pred.dir = _pred.dir === 'asc' ? 'desc' : 'asc';
  else { _pred.sort = col; _pred.dir = 'asc'; }
  _pred.page = 1;
  loadPredData();
}

function sortPredIcon(col) {
  if (_pred.sort !== col) return '<span class="sort-icon">&#8645;</span>';
  return `<span class="sort-icon">${_pred.dir === 'asc' ? '&#9650;' : '&#9660;'}</span>`;
}

function renderPredData(data) {
  const { total, page, pages, rows } = data;
  const start = (page - 1) * _pred.size + 1;
  const end   = Math.min(page * _pred.size, total);
  const discDot = d => `<span class="disc xs ${d}">${d}</span>`;

  const tableRows = rows.map(r => {
    const isFlag  = r.pattern === 'RRRR' || r.pattern === 'WWWW';
    const resCls  = r.result === 'WIN' ? 'win' : r.result === 'LOSS' ? 'loss' : 'muted';
    const oeColor = r.result === 'WIN' ? 'var(--green)' : r.result === 'LOSS' ? 'var(--red)' : null;
    const predClr = oeColor || (r.pred_oe === 'ODD' ? 'var(--yellow)' : r.pred_oe === 'EVEN' ? 'var(--accent)' : 'var(--muted)');
    const actClr  = oeColor || (r.oe === 'ODD' ? 'var(--yellow)' : 'var(--accent)');
    const rowStyle = isFlag ? 'background:rgba(249,115,22,.12);border-left:3px solid rgba(249,115,22,.6);' : '';
    const flagBadge = isFlag ? `<span style="color:#f97316;font-weight:700;font-size:10px;margin-left:4px">${r.pattern}</span>` : '';
    const isBet   = r.bet === 1 || r.bet === true || r.bet === 'BET';
    const betClr  = isBet ? 'var(--green)' : 'var(--muted)';
    const confStr = r.confidence ? `<span style="color:#3b82f6;font-size:11px"> (${pct(r.confidence)})</span>` : '';
    const wrStr   = r.band_wr != null && r.band_n >= 20
      ? `<span style="color:${r.band_wr>=0.55?'var(--green)':r.band_wr>=0.45?'var(--yellow)':'var(--red)'}">${pct(r.band_wr)}</span>`
      : '—';
    return `<tr style="${rowStyle}">
      <td style="font-size:11px;${oeColor?`color:${oeColor};font-weight:600`:''}">${r.id}${flagBadge}</td>
      <td>${wrStr}</td>
      <td style="color:${betClr};font-weight:600">${isBet?'BET':'—'}</td>
      <td><div style="display:flex;gap:2px">${[r.disc1,r.disc2,r.disc3,r.disc4].map(discDot).join('')}</div></td>
      <td style="font-weight:600;color:${predClr}">${r.pred_oe||'—'}${confStr}</td>
      <td style="font-weight:600;color:${actClr}">${r.oe||'—'}</td>
      <td class="${resCls}">${r.result||'—'}</td>
    </tr>`;
  }).join('');

  const pgBtns = () => {
    let b = '';
    const lo = Math.max(1, page-3), hi = Math.min(pages, page+3);
    if (lo > 1) b += `<button onclick="goPredPage(1)">1</button>${lo>2?'<span class="pg-info">…</span>':''}`;
    for (let pg=lo; pg<=hi; pg++) b += `<button class="${pg===page?'active':''}" onclick="goPredPage(${pg})">${pg}</button>`;
    if (hi < pages) b += `${hi<pages-1?'<span class="pg-info">…</span>':''}<button onclick="goPredPage(${pages})">${pages}</button>`;
    return b;
  };

  const body = document.getElementById('pred-hist-body');
  const info = document.getElementById('pred-hist-info');
  const pager = document.getElementById('pred-hist-pager');
  if (!body) return;
  body.innerHTML  = tableRows || '<tr><td colspan="7" style="color:var(--muted);padding:12px">No records found</td></tr>';
  if (info)  info.textContent = `${total.toLocaleString()} records · showing ${start}–${end}`;
  if (pager) pager.innerHTML  =
    `<button onclick="goPredPage(${page-1})" ${page<=1?'disabled':''}>&#8592; Prev</button>
     ${pgBtns()}
     <button onclick="goPredPage(${page+1})" ${page>=pages?'disabled':''}>Next &#8594;</button>
     <span class="pg-info">Page ${page} of ${pages}</span>`;
}

function goPredPage(p)       { _pred.page = p; loadPredData(); }
function onPredSizeChange(v) { _pred.size = parseInt(v); _pred.page = 1; loadPredData(); }
function onPredSearch(v) {
  clearTimeout(_predSearchTimer);
  _predSearchTimer = setTimeout(() => { _pred.search = v; _pred.page = 1; loadPredData(); }, 300);
}

async function loadNewModel() {
  const panel = document.getElementById('new-panel');
  panel.innerHTML = '<p style="padding:20px;color:var(--muted)">Loading new model data…</p>';
  try {
    const [predRes, dataRes, statsRes] = await Promise.all([
      fetch('/api/new/prediction'),
      fetch(`/api/new/data?page=1&size=${_newDb.size}&search=`),
      fetch('/api/new/stats'),

    if (!predRes.ok) {
      const err = await predRes.json().catch(() => ({}));
      panel.innerHTML = `<p class="error-msg" style="padding:20px">${err.error || 'No new model data yet. Refresh to run predict_new.py.'}</p>`;

function cgColorStyle(color) {
  if (color === 'red')   return 'color:#ef4444;font-weight:700';
  if (color === 'green') return 'color:#22c55e;font-weight:700';
  return 'color:var(--muted)';
}
function cgBall(color, is_purple) {
  if (!color) return '—';
  if (is_purple) return '🟣';
  return color === 'red' ? '🔴' : '🟢';
}
function cgBallFromNumber(n, color) {
  if (n == null || n < 0) return color === 'red' ? '🔴' : '🟢';
  if (n === 0) return '🔴🟣';
  if (n === 5) return '🟢🟣';
  return color === 'red' ? '🔴' : '🟢';
}
function cgColorLabel(color, is_purple) {
  if (!color) return '—';
  const purp = is_purple ? ' <span style="color:#a855f7;font-size:10px;font-weight:700">●</span>' : '';
  return `<span style="${cgColorStyle(color)}">${color.toUpperCase()}</span>${purp}`;
}

    const oeColor  = r.result === 'WIN' ? 'var(--green)' : r.result === 'LOSS' ? 'var(--red)' : null;
    const actIsP   = r.is_purple === 1;
    const predIsP  = r.pred_number === 0 || r.pred_number === 5;
    const actClr   = oeColor || (actIsP ? '#a855f7' : r.color === 'red' ? '#ef4444' : '#22c55e');
    const predClr  = oeColor || (predIsP ? '#a855f7' : r.pred_color === 'red' ? '#ef4444' : '#22c55e');
    const cconf    = r.confidence ? `<span style="color:#3b82f6;font-size:10px"> (${(r.confidence*100).toFixed(0)}%)</span>` : '';
    const betLbl   = r.bet ? '<span style="color:#22c55e;font-weight:700;font-size:11px">BET</span>' : '—';
    const isHit    = r.number_result === 'HIT';
    const pnNumClr = isHit ? '#22c55e' : (predIsP ? '#a855f7' : (r.pred_color === 'red' ? '#ef4444' : '#22c55e'));
    const actBall  = r.color      ? cgBallFromNumber(r.number,      r.color)      : '—';
    const predBall = r.pred_color ? cgBallFromNumber(r.pred_number, r.pred_color) : '—';
    const numDisp  = r.number      != null ? r.number      : '—';
    const pnFinal  = r.pred_number >= 0    ? r.pred_number : '—';
    const hitStyle = isHit
      ? 'background:rgba(34,197,94,.10);border-left:3px solid #22c55e;'
      : '';
    return `<tr style="${hitStyle}">
      <td style="font-size:11px">${r.id}</td>
      <td>${betLbl}</td>
      <td><span style="font-size:18px">${actBall}</span>
          <span style="font-weight:700;color:${actClr};font-size:16px;margin-left:4px">${numDisp}</span></td>
      <td><span style="font-size:18px">${predBall}</span>
          <span style="font-weight:700;font-size:16px;margin-left:4px;color:${pnNumClr}">${pnFinal}</span>${cconf}</td>
      <td class="${resCls}">${r.result||'—'}${isHit?' <span style="font-size:10px;color:#22c55e;font-weight:700"> ✓HIT</span>':''}</td>
    </tr>`;
  }).join('');

  const pgBtns = () => {
    const lo = Math.max(1, page-3), hi = Math.min(pages, page+3);
    let b = '';
    if (lo > 1) b += `<button onclick="goCgPage(1)">1</button>${lo>2?'<span class="pg-info">…</span>':''}`;
    for (let i = lo; i <= hi; i++) b += `<button onclick="goCgPage(${i})" ${i===page?'class="active"':''}>${i}</button>`;
    if (hi < pages) b += `${hi<pages-1?'<span class="pg-info">…</span>':''}<button onclick="goCgPage(${pages})">${pages}</button>`;
    return b;
  };

  document.getElementById('cg-panel').innerHTML = `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:8px;padding:10px">

    <!-- BET BANNER -->
    <div class="bet-banner ${isBet ? 'yes' : 'no'}">
      <div>
        <div class="bet-label ${isBet ? 'yes' : 'no'}">${isBet ? 'BET' : 'NO BET'}</div>
        <div class="bet-conf" style="margin-top:3px">
          color conf <strong style="color:${isBet?'var(--green)':'#64748b'}">${(ccconf*100).toFixed(1)}%</strong>
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="bet-direction ${isBet?(isRed?'odd':'even'):''}" style="${isBet?'':'color:#475569'}">
          <span style="font-size:28px">${pnum===0?'🔴🟣':pnum===5?'🟢🟣':(color==='red'?'🔴':'🟢')}</span>
        </div>
        <div style="font-size:22px;font-weight:700;margin-top:4px;color:${isPurpN?'#a855f7':isRed?'#ef4444':'#22c55e'}">
          ${pnum!=null?pnum:'?'}
        </div>
        <div class="bet-round" style="margin-top:4px">Round ${snap.next_id??'—'}</div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">P(red) / P(green)</div>
        <div style="font-size:18px;font-weight:700">
          <span style="color:#ef4444">${(pred.p_red!=null?(pred.p_red*100).toFixed(0):'-')}%</span>
          <span style="color:var(--muted);font-size:13px"> / </span>
          <span style="color:#22c55e">${(pred.p_red!=null?((1-pred.p_red)*100).toFixed(0):'-')}%</span>
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Purple?</div>
        <div style="font-size:26px">${ppurp?'🟣':'⚪'}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">p=${((pred.purple_conf||0)*100).toFixed(0)}%</div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Rule</div>
        <div style="font-size:12px;font-weight:600;color:var(--accent)">${sigs.rule||'—'}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">${sigs.cur_val||'—'} ×${sigs.cur_run??0}</div>
      </div>
    </div>

    <!-- COLOR CARD -->
    <div class="card">
      <h2>Color Prediction</h2>
      <div style="display:flex;gap:20px;margin-bottom:12px">
        <div><div class="big" style="color:#ef4444">🔴 ${(pred.p_red!=null?(pred.p_red*100).toFixed(1):'-')}<span style="font-size:20px">%</span></div><div class="label">0,2,4,6,8</div></div>
        <div><div class="big" style="color:#22c55e">🟢 ${(pred.p_red!=null?((1-pred.p_red)*100).toFixed(1):'-')}<span style="font-size:20px">%</span></div><div class="label">1,3,5,7,9</div></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <div class="row"><span class="key">Current run</span><span class="val">${sigs.cur_val||'—'} × ${sigs.cur_run??'—'}</span></div>
        <div class="row"><span class="key">Prev run</span><span class="val">${sigs.prev_run??'—'}</span></div>
        <div class="row"><span class="key">Alt run</span><span class="val">${sigs.alt_run??'—'}</span></div>
        <div class="row"><span class="key">Dom (8r)</span><span class="val">${sigs.dom_r8!=null?(sigs.dom_r8>=0.5?'RED '+pct(sigs.dom_r8):'GREEN '+pct(1-sigs.dom_r8)):'—'}</span></div>
        <div class="row"><span class="key">Rule</span><span class="val" style="font-size:11px;color:var(--muted)">${sigs.rule||'—'}</span></div>
        <div class="row"><span class="key">Loss streak</span>
          <span class="val" style="color:${(sigs.loss_streak||0)>=5?'var(--red)':(sigs.loss_streak||0)>=3?'var(--yellow)':'var(--green)'}">
            ${sigs.loss_streak??0}</span></div>
        ${sigs.mirror_info ? `
        <div style="margin-top:8px;padding:5px 8px;background:rgba(234,179,8,.08);border-radius:5px;border-left:3px solid var(--yellow)">
          <span style="font-size:10px;color:var(--yellow);font-weight:700">MIRROR TILE</span>
          <span style="font-size:11px;color:var(--muted);margin-left:6px">${sigs.mirror_info.tile_size||'?'}r · ${sigs.mirror_info.cycles} tiles</span>
        </div>` : ''}
      </div>
    </div>

    <!-- NUMBER + PURPLE CARD -->
    <div class="card">
      <h2>Number &amp; Purple</h2>
      <div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Top numbers (${isPurpN?'🟣':(isRed?'🔴':'🟢')} group)</div>
        ${numBars || '<div style="color:var(--muted);font-size:11px">Not enough data</div>'}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <div class="row"><span class="key">Predicted number</span>
          <span class="val" style="font-weight:700;color:${isRed?'#ef4444':'#22c55e'};font-size:16px">
            ${pnum!=null?pnum:'—'}
            ${isPurpN?'<span style="color:#a855f7;font-size:12px"> ●</span>':''}
          </span></div>
        <div class="row"><span class="key">Number conf</span><span class="val">${pred.number_conf!=null?pct(pred.number_conf):'—'}</span></div>
        <div class="row" style="margin-top:6px"><span class="key">Purple prediction</span>
          <span class="val" style="font-weight:700">
            ${ppurp?'🟣 expected':'⚪ not purple'}</span></div>
        <div class="row"><span class="key">Purple confidence</span><span class="val">${pred.purple_conf!=null?pct(pred.purple_conf):'—'}</span></div>
        ${psigs.gap_since_last!=null?`<div class="row"><span class="key">Gap since last 🟣</span><span class="val">${psigs.gap_since_last} rounds</span></div>`:''}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px;font-size:11px;color:var(--muted)">
        🔴 0,2,4,6,8 &nbsp; 🟢 1,3,5,7,9 &nbsp; 🟣 0,5 (purple)
      </div>
    </div>

    <!-- COLD + HOT NUMBERS CARD -->
    <div class="card">
      <h2>❄️ Cold &amp; 🔥 Hot Numbers</h2>
      ${(() => {
        const cold50  = snap.cold_50  || [];
        const cold100 = snap.cold_100 || [];
        const hot50   = snap.hot_50   || [];
        const hot100  = snap.hot_100  || [];

        const ballNum = d => {
          const b = d===0 ? '🔴🟣' : d===5 ? '🟢🟣' : (d%2===0 ? '🔴' : '🟢');
          return `<span style="font-size:18px">${b}</span><span style="font-size:18px;font-weight:700;margin-left:2px">${d}</span>`;
        };

        const coldTile = (d, i) => {
          const a = ['.5','.3','.15'][i];
          const ball = d.number===0?'🔴🟣':d.number===5?'🟢🟣':(d.number%2===0?'🔴':'🟢');
          return `<div style="flex:1;min-width:0;background:rgba(99,102,241,${i===0?.12:.05});border:1px solid rgba(99,102,241,${a});
                        border-radius:6px;padding:4px 2px;text-align:center">
            <div style="font-size:9px;color:rgba(99,102,241,.6);line-height:1">❄️${i+1}</div>
            <div style="font-size:15px;line-height:1.2">${ball}</div>
            <div style="font-size:13px;font-weight:700;line-height:1">${d.number}</div>
            <div style="font-size:9px;color:rgba(99,102,241,.8);font-weight:700">${d.count}×</div>
          </div>`;
        };
        const hotTile = (d, i) => {
          const a = ['.5','.35','.22','.14','.08'][i];
          const ball = d.number===0?'🔴🟣':d.number===5?'🟢🟣':(d.number%2===0?'🔴':'🟢');
          return `<div style="flex:1;min-width:0;background:rgba(239,68,68,${i===0?.10:.04});border:1px solid rgba(239,68,68,${a});
                        border-radius:6px;padding:4px 2px;text-align:center">
            <div style="font-size:9px;color:rgba(239,68,68,.7);line-height:1">🔥${i+1}</div>
            <div style="font-size:15px;line-height:1.2">${ball}</div>
            <div style="font-size:13px;font-weight:700;line-height:1">${d.number}</div>
            <div style="font-size:9px;color:rgba(239,68,68,.8);font-weight:700">${d.count}×</div>
          </div>`;
        };
        const section = (coldItems, hotItems, window) => `
          <div style="margin-bottom:8px">
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">
              Last ${window} rounds — ❄️ 3 cold &nbsp;·&nbsp; 🔥 5 hot
            </div>
            <div style="display:flex;gap:3px;overflow:hidden">
              ${coldItems.map(coldTile).join('')}
              <div style="width:1px;background:var(--border);flex-shrink:0;margin:0 2px"></div>
              ${hotItems.map(hotTile).join('')}
            </div>
          </div>`;

        return section(cold50, hot50, 50) +
               `<div style="border-top:1px solid var(--border);margin:4px 0 6px"></div>` +
               section(cold100, hot100, 100);
      })()}
      <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Accuracy</div>
        <div style="display:flex;background:rgba(255,255,255,.03);border-radius:6px;overflow:hidden">
          ${wrCell('Color L100', s1.wr, s1.n, s1.nr!=null?'Num '+( s1.nr*100).toFixed(0)+'%':'')}
          ${wrCell('Color L200', s2.wr, s2.n, s2.nr!=null?'Num '+(s2.nr*100).toFixed(0)+'%':'')}
          ${wrCell('BET-only',   sb.wr, sb.n, sb.nr!=null?'Num '+(sb.nr*100).toFixed(0)+'%':'')}
          <div style="text-align:center;padding:6px 10px">
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Total</div>
            <div style="font-size:16px;font-weight:700">${stats.total_predicted??'—'}</div>
            <div style="font-size:9px;color:var(--muted)">predicted</div>
          </div>
        </div>
      </div>
    </div>

    <!-- HISTORY TABLE -->
    <div class="card" style="grid-column:1/-1">
      <h2>Color Game — All Rounds</h2>
      <div class="data-toolbar" style="padding:0 0 8px">
        <input type="text" placeholder="Search ID, red, green, purple, hit, WIN/LOSS…"
               value="${_cg.search}" oninput="onCgSearch(this.value)">
        <select onchange="onCgSizeChange(this.value)">
          ${[25,50,100,200].map(n=>`<option value="${n}" ${n===_cg.size?'selected':''}>${n} / page</option>`).join('')}
        </select>
        <span id="cg-hist-info" style="font-size:11px;color:var(--muted);margin-left:auto"></span>
      </div>
      <table>
        <colgroup>
          <col style="width:20%"><col style="width:8%">
          <col style="width:28%"><col style="width:28%"><col style="width:16%">
        </colgroup>
        <thead><tr>
          <th onclick="sortCg('id')">Round</th>
          <th>Bet</th>
          <th onclick="sortCg('color')">Actual color · number</th>
          <th onclick="sortCg('pred_color')">Predicted color · number</th>
          <th onclick="sortCg('result')">Result</th>
        </tr></thead>
        <tbody id="cg-hist-body">${tableRows||'<tr><td colspan="5" style="color:var(--muted);padding:12px">No records</td></tr>'}</tbody>
      </table>
      <div class="pagination" id="cg-hist-pager">
        <button onclick="goCgPage(${page-1})" ${page<=1?'disabled':''}>&#8592; Prev</button>
        ${pgBtns()}
        <button onclick="goCgPage(${page+1})" ${page>=pages?'disabled':''}>Next &#8594;</button>
      </div>
    </div>

  </div>`;

  const info = document.getElementById('cg-hist-info');
  if (info && total) info.textContent = `${total.toLocaleString()} records · showing ${start}–${end}`;
}

function goCgPage(p) {
  _cg.page = p;
  loadColorGame();
}
function onCgSearch(v) {
  _cg.search = v; _cg.page = 1;
  clearTimeout(_cgSearchTimer);
  _cgSearchTimer = setTimeout(loadColorGame, 350);
}
let _cgSearchTimer = null;
function onCgSizeChange(v) { _cg.size = parseInt(v); _cg.page = 1; loadColorGame(); }
function sortCg(col) {
  if (_cg.sort === col) _cg.dir = _cg.dir === 'asc' ? 'desc' : 'asc';
  else { _cg.sort = col; _cg.dir = 'desc'; }
  _cg.page = 1;
  loadColorGame();
}
</script>
</body>
</html>
