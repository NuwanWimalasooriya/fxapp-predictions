          <div style="border-top:1px solid var(--border);padding-top:8px">
            <div class="row"><span class="key">Zone</span><span class="val" style="color:${zoneClr};font-weight:700">${sumZone} (~${sumVal})</span></div>
            <div class="row"><span class="key">Last sum</span>
              <span class="val" style="color:${lastS>=18?'#f97316':'#60a5fa'};font-weight:700">${lastS} (${lastS>=18?'BIG':'SMALL'} · ${lastS%2===0?'EVEN':'ODD'})</span></div>
            <div class="row"><span class="key">Avg (last 10)</span><span class="val">${avgS.toFixed(1)}</span></div>
            <div class="row"><span class="key">Trend</span>
              <span class="val" style="color:${sumVal>avgS?'#f97316':sumVal<avgS?'#60a5fa':'#94a3b8'}">${sumVal>avgS?'Rising':sumVal<avgS?'Falling':'Flat'}</span></div>
          </div>
          `;
      })()}
    </div>

    <!-- WIN RATE TILE -->
    <div class="card">
      <h2>Win Rate — BIG/SMALL</h2>
      ${(() => {
        const wrC = wr => wr == null ? 'var(--muted)' : wr >= 0.65 ? '#22c55e' : wr >= 0.53 ? 'var(--green)' : wr >= 0.47 ? 'var(--yellow)' : 'var(--red)';
        const cell = (label, wr, n, wins) => `
          <div style="margin-bottom:8px">
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px">${label}</div>
            <div style="font-size:20px;font-weight:700;color:${wrC(wr)}">${wr != null ? (wr*100).toFixed(1)+'%' : '—'}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:1px">${n != null ? `${wins != null ? wins+'W · ' : ''}n=${n}` : 'no data'}</div>
          </div>`;
        return `
          ${cell('Last 100', s1.wr, s1.n, s1.win)}
          ${cell('Last 200', s2.wr, s2.n, s2.win)}
          ${cell('BET-only', sb.wr, sb.n, sb.win)}
          <div style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px">
            <div class="row"><span class="key">Total scored</span><span class="val">${stats.total_predicted ?? '—'} rounds</span></div>
            <div class="row"><span class="key">BET threshold</span><span class="val" style="color:#3b82f6;font-weight:700">60%</span></div>
          </div>`;
      })()}
    </div>

    <!-- SUM HIT RATE TILE -->
    <div class="card">
      <h2>Sum Hit Rate</h2>
      ${(() => {
        const wrC = wr => wr == null ? 'var(--muted)' : wr >= 0.40 ? '#22c55e' : wr >= 0.30 ? 'var(--yellow)' : 'var(--red)';
        const row = (label, wr, n, wins) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e293b">
            <span style="font-size:12px;color:var(--muted)">${label}</span>
            <span style="font-size:14px;font-weight:700;color:${wrC(wr)}">${wr != null ? (wr*100).toFixed(1)+'%' : '—'}<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:5px">${n ? wins+'W/'+n : ''}</span></span>
          </div>`;
        return `
          <div style="margin-bottom:10px">
            <div style="font-size:10px;color:#f59e0b;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:4px">HIT-HOT SUM</div>
            ${row('Last 50',  sHot50.wr,  sHot50.n,  sHot50.win)}
            ${row('Last 100', sHot100.wr, sHot100.n, sHot100.win)}
            ${row('Last 200', sHot200.wr, sHot200.n, sHot200.win)}
          </div>
          <div>
            <div style="font-size:10px;color:#22d3ee;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:4px">HIT-HD SUM</div>
            ${row('Last 50',  sHd50.wr,  sHd50.n,  sHd50.win)}
            ${row('Last 100', sHd100.wr, sHd100.n, sHd100.win)}
            ${row('Last 200', sHd200.wr, sHd200.n, sHd200.win)}
          </div>
          <div style="margin-top:8px;font-size:10px;color:var(--muted)">Hit = actual sum in predicted list (5 candidates)</div>`;
      })()}
    </div>

    <!-- HISTORY TABLE (full width) -->
    <div class="card" style="grid-column:1/-1">
      <h2>All rounds — FST1M (1-min 4-Star Lottery)</h2>
      <div class="data-toolbar" style="padding:0 0 8px">
        <input id="fst1m-search-input" type="text" placeholder="Search ID, BIG, SMALL, ODD, EVEN, LOW, MID, HIGH, WIN, LOSS, BET…"
               oninput="onFst1mSearch(this.value)">
        <select onchange="onFst1mSizeChange(this.value)">
          ${[25,50,100,200].map(n=>`<option value="${n}" ${n===_fst1m.size?'selected':''}>${n} / page</option>`).join('')}
        </select>
        <span id="fst1m-hist-info" style="font-size:11px;color:var(--muted);margin-left:auto"></span>
      </div>
      <table>
        <colgroup>
          <col style="width:12%"><col style="width:9%"><col style="width:4%">
          <col style="width:7%"><col style="width:6%"><col style="width:8%">
          <col style="width:10%"><col style="width:5%"><col style="width:7%">
          <col style="width:7%"><col style="width:25%">
        </colgroup>
        <thead><tr>
          <th>Round</th><th>Numbers</th><th>Sum</th>
          <th>Big/Small</th><th>Odd/Even</th><th>Pred HD Sum</th><th>Pred HOT Sum</th><th>Bet</th>
          <th>Pred BS</th><th>Pred OE</th><th>Result</th>
        </tr></thead>
        <tbody id="fst1m-hist-body"><tr><td colspan="10" style="color:var(--muted);padding:12px">Loading…</td></tr></tbody>
      </table>
      <div class="pagination" id="fst1m-hist-pager"></div>
    </div>

  </div>`;
  renderFst1mData(paged);
}

// ── BLK3M ──────────────────────────────────────────────────────────────────────
let _blk3m = { page: 1, size: 50, search: '' };
let _blk3mSearchTimer = null;

async function loadBlk3m() {
  const panel = document.getElementById('blk3m-panel');
  panel.innerHTML = '<p style="padding:20px;color:var(--muted)">Loading BLK3M data…</p>';
  try {
    const [predRes, dataRes, statsRes] = await Promise.all([
      fetch('/api/blk3m/prediction'),
      fetch(`/api/blk3m/data?page=${_blk3m.page}&size=${_blk3m.size}&search=${encodeURIComponent(_blk3m.search)}`),
      fetch('/api/blk3m/stats'),
    ]);
    const p     = predRes.ok  ? await predRes.json().catch(() => ({}))  : {};
    const paged = dataRes.ok  ? await dataRes.json().catch(() => ({}))  : {};
    const stats = statsRes.ok ? await statsRes.json().catch(() => ({})) : {};
    renderBlk3m(p, paged, stats);
  } catch(e) {
    document.getElementById('blk3m-panel').innerHTML = `<p class="error-msg" style="padding:20px">Error: ${e.message}</p>`;
  }
}

async function loadBlk3mData() {
  const res = await fetch(`/api/blk3m/data?page=${_blk3m.page}&size=${_blk3m.size}&search=${encodeURIComponent(_blk3m.search)}`);
  if (!res.ok) return;
  renderBlk3mData(await res.json());
}

function onBlk3mSearch(val) {
  _blk3m.search = val; _blk3m.page = 1;
  clearTimeout(_blk3mSearchTimer);
  _blk3mSearchTimer = setTimeout(loadBlk3mData, 300);
}
function onBlk3mSizeChange(val) { _blk3m.size = +val; _blk3m.page = 1; loadBlk3mData(); }

function renderBlk3m(p, paged, stats) {
  const sigs    = p.signals   || {};
  const isBig   = p.pred_bs  === 'BIG';
  const conf    = p.confidence ?? 0;
  const isBet   = p.is_bet   ?? (conf >= 0.58);
  const isBetOe = p.is_bet_oe ?? false;
  const predOe  = p.pred_oe  ?? sigs.pred_oe ?? '—';
  const confOe  = p.conf_oe  ?? sigs.conf_oe ?? 0;
  const ruleOe  = p.rule_oe  ?? sigs.rule_oe ?? '—';
  const lastTotal = p.last_total ?? '—';
  const lastBs    = p.last_bs    ?? '—';
  const lastOe    = p.last_oe    ?? '—';

  const s1  = stats.last100  || {};
  const s2  = stats.last200  || {};
  const sb  = stats.bet_only || {};
  const so1 = stats.oe_last100 || {};
  const sob = stats.oe_bet     || {};

  const wrColor  = wr => wr == null ? 'var(--muted)' : wr >= 0.65 ? '#22c55e' : wr >= 0.53 ? 'var(--green)' : wr >= 0.47 ? '#eab308' : '#ef4444';
  const bsDirClr = isBig ? '#f97316' : '#60a5fa';
  const oeClr    = predOe === 'ODD' ? '#a78bfa' : '#60a5fa';

  document.getElementById('blk3m-panel').innerHTML = `
  <div class="grid" style="align-items:start">

    <!-- BET BANNER -->
    <div class="bet-banner ${isBet || isBetOe ? 'yes' : 'no'}" style="padding:7px 12px">
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Big/Small</div>
        <div class="bet-label ${isBet ? 'yes' : 'no'}" style="font-size:22px">${isBet ? 'BET' : 'SKIP'}</div>
        <div style="font-size:20px;font-weight:800;color:${isBet ? bsDirClr : '#475569'};margin-top:2px">${isBig ? 'BIG' : 'SMALL'} ${pct(conf)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${sigs.rule || '—'}</div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Odd/Even</div>
        <div class="bet-label ${isBetOe ? 'yes' : 'no'}" style="font-size:22px">${isBetOe ? 'BET' : 'SKIP'}</div>
        <div style="font-size:20px;font-weight:800;color:${isBetOe ? oeClr : '#475569'};margin-top:2px">${predOe} ${pct(confOe)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${ruleOe}</div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Last result</div>
        <div style="font-size:26px;font-weight:700;color:${lastBs==='BIG'?'#f97316':'#60a5fa'}">${lastTotal}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${lastBs} · ${lastOe}</div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Streak</div>
        <div style="font-size:12px;margin-top:4px">BS: <strong style="color:${bsDirClr}">${sigs.cur_val||'—'}×${sigs.cur_run??'—'}</strong></div>
        <div style="font-size:12px;margin-top:4px">OE: <strong style="color:${oeClr}">${sigs.pred_oe||'—'} run ${sigs.cur_run??'—'}</strong></div>
      </div>
      <div class="divider"></div>
      <div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Round</div>
        <div class="bet-round">${p.next_round_id ?? '—'}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">Next: <span id="timer-blk3m" style="font-weight:700;font-size:12px;color:#00ffcc;text-shadow:0 0 6px #00ffcc">—</span></div>
      </div>
    </div>

    <!-- BIG / SMALL -->
    <div class="card">
      <h2>BIG / SMALL</h2>
      <div style="display:flex;gap:20px;margin-bottom:12px">
        <div>
          <div class="big" style="color:#f97316;font-size:26px">${pct(isBig ? conf : 1-conf)}</div>
          <div class="label" style="color:#f97316;margin-top:3px">BIG (8–f)</div>
        </div>
        <div>
          <div class="big" style="color:#60a5fa;font-size:26px">${pct(!isBig ? conf : 1-conf)}</div>
          <div class="label" style="color:#60a5fa;margin-top:3px">SMALL (0–7)</div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <div class="row"><span class="key">Prediction</span>
          <span class="val" style="color:${bsDirClr}">${isBig?'BIG':'SMALL'} — ${isBet?'BET':'SKIP'}</span></div>
        <div class="row"><span class="key">Confidence</span><span class="val">${pct(conf)}</span></div>
        <div class="row"><span class="key">Rule</span><span class="val" style="font-size:10px">${sigs.rule||'—'}</span></div>
        <div class="row"><span class="key">Current run</span><span class="val">${sigs.cur_val||'—'} × ${sigs.cur_run??'—'}</span></div>
        <div class="row"><span class="key">Prev run</span><span class="val">${sigs.prev_val||'—'} × ${sigs.prev_run??'—'}</span></div>
        <div class="row"><span class="key">Maj20</span><span class="val">${sigs.maj20||'—'} (${pct(sigs.maj20_frac)})</span></div>
      </div>
    </div>

    <!-- ODD / EVEN -->
    <div class="card">
      <h2>ODD / EVEN</h2>
      <div style="display:flex;gap:20px;margin-bottom:12px">
        <div>
          <div class="big" style="color:#a78bfa;font-size:26px">${pct(predOe==='ODD' ? confOe : 1-confOe)}</div>
          <div class="label" style="color:#a78bfa;margin-top:3px">ODD</div>
        </div>
        <div>
          <div class="big" style="color:#60a5fa;font-size:26px">${pct(predOe==='EVEN' ? confOe : 1-confOe)}</div>
          <div class="label" style="color:#60a5fa;margin-top:3px">EVEN</div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <div class="row"><span class="key">Prediction</span>
          <span class="val" style="color:${oeClr}">${predOe} — ${isBetOe?'BET':'SKIP'}</span></div>
        <div class="row"><span class="key">Confidence</span><span class="val">${pct(confOe)}</span></div>
        <div class="row"><span class="key">Rule</span><span class="val" style="font-size:10px">${ruleOe}</span></div>
        <div class="row"><span class="key">Last 10 BS</span><span class="val" style="font-size:10px">${(sigs.last10_bs||[]).join(' ')}</span></div>
        <div class="row"><span class="key">Last 10 OE</span><span class="val" style="font-size:10px">${(sigs.last10_oe||[]).join(' ')}</span></div>
      </div>
    </div>

    <!-- WIN RATE STATS -->
    <div class="card">
      <h2>Win Rate Stats</h2>
      ${[
        ['BS last 100', s1.wr, s1.win, s1.n],
        ['BS last 200', s2.wr, s2.win, s2.n],
        ['BS bets only', sb.wr, sb.win, sb.n],
        ['OE last 100', so1.wr, so1.win, so1.n],
        ['OE bets only', sob.wr, sob.win, sob.n],
      ].map(([lbl, wr, w, n]) => `
      <div class="row">
        <span class="key">${lbl}</span>
        <span class="val" style="color:${wrColor(wr)}">${wr!=null?(wr*100).toFixed(1)+'%':'—'}${n?' <span style="font-size:10px;color:var(--muted)">(${w}/${n})</span>':''}</span>
      </div>`).join('')}
    </div>

    <!-- HISTORY -->
    <div class="card" style="grid-column:1/-1">
      <h2>History</h2>
      <div class="data-toolbar">
        <input type="search" placeholder="Search round…" style="background:#1e293b;border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:12px;width:160px"
               oninput="onBlk3mSearch(this.value)">
        <select onchange="onBlk3mSizeChange(this.value)" style="background:#1e293b;border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:12px">
          ${[25,50,100,200].map(n=>`<option value="${n}" ${n===_blk3m.size?'selected':''}>${n} rows</option>`).join('')}
        </select>
        <span id="blk3m-hist-info" style="font-size:11px;color:var(--muted);margin-left:auto"></span>
      </div>
      <table>
        <colgroup>
          <col style="width:20%"><col style="width:10%"><col style="width:10%">
          <col style="width:10%"><col style="width:10%"><col style="width:10%">
          <col style="width:10%"><col style="width:10%"><col style="width:10%">
        </colgroup>
        <thead><tr>
          <th>Round</th><th>Raw Value</th><th>Hex</th>
          <th>Big/Small</th><th>Odd/Even</th>
          <th>Pred BS</th><th>Result BS</th>
          <th>Pred OE</th><th>Result OE</th>
        </tr></thead>
        <tbody id="blk3m-hist-body"><tr><td colspan="9" style="color:var(--muted);padding:12px">Loading…</td></tr></tbody>
      </table>
      <div class="pagination" id="blk3m-hist-pager"></div>
    </div>

  </div>`;
  renderBlk3mData(paged);
  startBlk3mTimer(p.next_round_id);
}

function startBlk3mTimer(nextId) {
  if (!nextId) return;
  function tick() {
    const el = document.getElementById('timer-blk3m');
    if (!el) return;
    const now  = Math.floor(Date.now() / 1000);
    const slot = Math.floor(now / 180) * 180;
    const next = slot + 180;
    const rem  = next - now;
    const m    = Math.floor(rem / 60);
    const s    = rem % 60;
    el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
  tick();
  clearInterval(window._blk3mTimerInterval);
  window._blk3mTimerInterval = setInterval(tick, 1000);
}

function renderBlk3mData(paged) {
  const body  = document.getElementById('blk3m-hist-body');
  const pager = document.getElementById('blk3m-hist-pager');
  const info  = document.getElementById('blk3m-hist-info');
  if (!body) return;
  if (!paged || !paged.rows) { body.innerHTML = '<tr><td colspan="9" style="color:var(--muted)">No data.</td></tr>'; return; }
  if (info) info.textContent = `${paged.total} rounds`;
  body.innerHTML = paged.rows.map(r => {
    const resClr  = r.result    === 'WIN' ? 'win' : r.result    === 'LOSS' ? 'loss' : 'np';
    const resOeClr= r.result_oe === 'WIN' ? 'win' : r.result_oe === 'LOSS' ? 'loss' : 'np';
    const bsClr   = r.big_small === 'BIG'  ? '#f97316' : '#60a5fa';
    const oeClr   = r.odd_even  === 'ODD'  ? '#a78bfa' : '#60a5fa';
    const hexChar = r.value ? r.value.trim().slice(-1) : '—';
    return `<tr>
      <td>${r.id}</td>
      <td style="font-size:10px;color:var(--muted)">${r.value ?? '—'}</td>
      <td style="font-weight:800;font-size:15px;color:${r.big_small==='BIG'?'#f97316':'#60a5fa'}">${hexChar}</td>
      <td style="color:${bsClr};font-weight:600">${r.big_small}</td>
      <td style="color:${oeClr};font-weight:600">${r.odd_even}</td>
      <td>${r.pred_bs ? `<span style="color:${r.pred_bs==='BIG'?'#f97316':'#60a5fa'}">${r.pred_bs}</span>${r.bet?'<span class="bet-chip">BET</span>':''}` : '<span class="muted">—</span>'}</td>
      <td class="${resClr}">${r.result === 'Not Predicted' ? '—' : r.result || '—'}</td>
      <td>${r.pred_oe ? `<span style="color:${r.pred_oe==='ODD'?'#a78bfa':'#60a5fa'}">${r.pred_oe}</span>${r.bet_oe?'<span class="bet-chip">BET</span>':''}` : '<span class="muted">—</span>'}</td>
      <td class="${resOeClr}">${r.result_oe === 'Not Predicted' ? '—' : r.result_oe || '—'}</td>
    </tr>`;
  }).join('');
  if (pager) {
    const pg = paged.page, pages = paged.pages;
    const btns = [];
    if (pg > 1)     btns.push(`<button onclick="_blk3m.page=${pg-1};loadBlk3mData()">&#8592;</button>`);
    btns.push(`<span style="padding:0 8px;font-size:12px">${pg}/${pages}</span>`);
    if (pg < pages) btns.push(`<button onclick="_blk3m.page=${pg+1};loadBlk3mData()">&#8594;</button>`);
    pager.innerHTML = btns.join('');
  }
}
</script>
